<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modo Administrador · Índice CESPU de Maturidade IA</title>
<link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<div class="container">
  <div class="topo-marca"><img src="/img/logo.png" alt="CESPU"></div>
  <h2 style="text-align:center;">Modo Administrador</h2>

  <div id="ecraLogin" class="cartao" style="max-width:400px; margin:0 auto;">
    <div class="campo-form">
      <label>Password de acesso</label>
      <input type="password" id="campoSenha" placeholder="••••••••">
    </div>
    <button class="botao" style="width:100%;" onclick="autenticar()">Entrar</button>
    <p id="erroLogin" style="color:#e74c3c; display:none; margin-top:10px;">Password incorreta.</p>
  </div>

  <div id="painelAdmin" style="display:none;">
    <div class="grid grid-3" style="margin-bottom:18px;">
      <div class="cartao">
        <div class="campo-form">
          <label>Título do evento</label>
          <input type="text" id="campoTitulo">
        </div>
        <div class="campo-form">
          <label>Participantes esperados</label>
          <input type="number" id="campoEsperados" min="1">
        </div>
        <button class="botao pequeno" onclick="guardarConfig()">Guardar configuração</button>
      </div>
      <div class="cartao">
        <div class="painel-titulo">Sessão</div>
        <p>Participantes já registados: <b id="infoTotal">0</b></p>
        <label style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
          <input type="checkbox" id="campoAtiva"> Sessão ativa (aceitar respostas)
        </label>
        <button class="botao pequeno" onclick="alternarAtiva()">Guardar estado</button>
        <hr style="border-color: rgba(255,255,255,0.08); margin:14px 0;">
        <button class="botao perigo pequeno" onclick="confirmarReset()">Reiniciar sessão (apagar respostas)</button>
      </div>
      <div class="cartao">
        <div class="painel-titulo">Segurança</div>
        <div class="campo-form">
          <label>Nova password de administrador</label>
          <input type="password" id="campoNovaSenha" placeholder="mínimo 4 caracteres">
        </div>
        <button class="botao pequeno" onclick="mudarSenha()">Alterar password</button>
        <hr style="border-color: rgba(255,255,255,0.08); margin:14px 0;">
        <a class="botao secundario pequeno" href="/api/admin/exportar" target="_blank">Exportar dados (JSON)</a>
      </div>
    </div>

    <div class="cartao" style="margin-bottom:18px;">
      <div class="painel-titulo">Nova dimensão (eixo)</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
        <div class="campo-form" style="flex:1; min-width:160px;">
          <label>Chave técnica</label>
          <input type="text" id="novaDimensaoChave" placeholder="ex: sustentabilidade">
        </div>
        <div class="campo-form" style="flex:2; min-width:220px;">
          <label>Nome apresentado</label>
          <input type="text" id="novaDimensaoNome" placeholder="ex: Sustentabilidade e IA">
        </div>
        <button class="botao pequeno" onclick="criarDimensao()">Criar dimensão</button>
      </div>
    </div>

    <div class="cartao">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <div class="painel-titulo" style="margin:0;">Perguntas (<span id="contagemPerguntas">0</span>)</div>
        <button class="botao pequeno" onclick="abrirModalPergunta()">+ Adicionar pergunta</button>
      </div>
      <table>
        <thead>
          <tr><th>#</th><th>Pilar</th><th>Eixo</th><th>Pergunta</th><th>Estado</th><th>Ações</th></tr>
        </thead>
        <tbody id="corpoTabelaPerguntas"></tbody>
      </table>
    </div>

    <div class="cartao" style="margin-top:18px;">
      <div class="painel-titulo">Pergunta final aberta</div>
      <div class="campo-form">
        <label>Texto</label>
        <input type="text" id="campoPerguntaAberta">
      </div>
      <label style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
        <input type="checkbox" id="campoAbertaAtiva"> Ativa
      </label>
      <button class="botao pequeno" onclick="guardarPerguntaAberta()">Guardar</button>
    </div>
  </div>
</div>

<div id="modalPergunta" class="modal-fundo" style="display:none;">
  <div class="modal-caixa">
    <h3 id="modalTitulo">Nova pergunta</h3>
    <input type="hidden" id="modalId">
    <div class="campo-form">
      <label>Texto da pergunta</label>
      <textarea id="modalTexto" class="campo-aberto" style="min-height:70px;"></textarea>
    </div>
    <div class="campo-form">
      <label>Pilar</label>
      <select id="modalPilar">
        <option value="I">I · Saber sobre IA</option>
        <option value="II">II · Fazer com IA</option>
        <option value="III">III · Ser sem IA</option>
      </select>
    </div>
    <div class="campo-form">
      <label>Eixo</label>
      <select id="modalEixo"></select>
    </div>
    <div class="campo-form">
      <label>Critério de maturidade</label>
      <select id="modalCriterio">
        <option value="mediacao_humana">Mediação humana</option>
        <option value="verificacao">Verificação</option>
        <option value="transparencia">Transparência</option>
        <option value="literacia_afetiva">Literacia afetiva</option>
        <option value="decisao_evidencia">Decisão baseada em evidências</option>
      </select>
    </div>
    <div class="campo-form">
      <label>Escala (5 níveis, separados por vírgula)</label>
      <input type="text" id="modalEscala" value="Nunca, Raramente, Ocasionalmente, Frequentemente, Sempre">
    </div>
    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:16px;">
      <button class="botao secundario pequeno" onclick="fecharModal()">Cancelar</button>
      <button class="botao pequeno" onclick="guardarModalPergunta()">Guardar</button>
    </div>
  </div>
</div>

<script src="/js/comum.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
