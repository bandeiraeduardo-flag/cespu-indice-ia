<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modo Apresentador · Índice CESPU de Maturidade IA</title>
<link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<div class="container" style="max-width:820px;">
  <div class="topo-marca"><img src="/img/logo.png" alt="CESPU"></div>
  <h2 style="text-align:center;">Modo Apresentador</h2>

  <div id="ecraLogin" class="cartao" style="max-width:400px; margin:0 auto;">
    <div class="campo-form">
      <label>Password de acesso</label>
      <input type="password" id="campoSenha" placeholder="••••••••">
    </div>
    <button class="botao" style="width:100%;" onclick="autenticar()">Entrar</button>
    <p id="erroLogin" style="color:#e74c3c; display:none; margin-top:10px;">Password incorreta.</p>
  </div>

  <div id="painelApresentador" style="display:none;">
    <div class="cartao" style="margin-bottom:18px;">
      <div class="painel-titulo">Atalhos</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <a class="botao secundario" href="/projecao.html" target="_blank">Abrir ecrã QR</a>
        <a class="botao secundario" href="/dashboard.html" target="_blank">Abrir dashboard ao vivo</a>
        <a class="botao secundario" href="/api/relatorio/pdf" target="_blank">Descarregar relatório PDF</a>
      </div>
    </div>

    <div class="cartao" style="margin-bottom:18px;">
      <div class="painel-titulo">Destacar no dashboard</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="botao pequeno" onclick="destacar('radar')">Radar</button>
        <button class="botao pequeno" onclick="destacar('niveis')">Distribuição de níveis</button>
        <button class="botao pequeno" onclick="destacar('heatmap')">Heatmap</button>
        <button class="botao pequeno" onclick="destacar('wordcloud')">Word Cloud</button>
        <button class="botao secundario pequeno" onclick="destacar(null)">Remover destaque</button>
      </div>
    </div>

    <div class="cartao" style="margin-bottom:18px;">
      <div class="painel-titulo">Modo de sessão</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="botao pequeno" onclick="mudarModo('dashboard')">Dashboard</button>
        <button class="botao pequeno" onclick="mudarModo('discussao')">Discussão</button>
        <button class="botao pequeno" onclick="mudarModo('relatorio')">Relatório</button>
      </div>
      <p style="color:var(--cor-cinza); font-size:0.85rem; margin-top:10px;">Modo atual: <b id="modoAtual">–</b></p>
    </div>

    <div class="cartao">
      <div class="painel-titulo">Estado da sessão</div>
      <p>Participantes: <b id="infoTotal">0</b> · Índice global: <b id="infoIndice">0%</b> · Nível: <b id="infoNivel">–</b></p>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <a class="botao secundario pequeno" href="/admin.html">Ir para Modo Administrador</a>
        <button class="botao perigo pequeno" onclick="confirmarReset()">Reiniciar sessão</button>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/comum.js"></script>
<script src="/js/apresentador.js"></script>
</body>
</html>
